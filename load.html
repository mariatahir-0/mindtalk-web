<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindTalks | Loading...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #f3effc;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }

    /* LOGO */
    .logo {
      width: 300px;
      height: auto;
      margin-bottom: 40px;
      animation: logoBounce 2s infinite ease-in-out;
    }

    @keyframes logoBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .circle-loader {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(108, 90, 145, 0.2);
      border-top-color: #6c5a91;
      border-radius: 50%;
      margin-top: -2cm;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .fade-out {
      animation: fadeOut 0.8s ease forwards;
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

  </style>
</head>
<body>
  <img src="mindtalks/final_logo-removebg-preview.png" alt="MindTalks Logo" class="logo">
  <div class="circle-loader"></div>

  <script>
    setTimeout(() => {
      document.body.classList.add("fade-out");
      setTimeout(() => {
        window.location.href = "acc.html"; 
      }, 800);
    }, 3000);
  </script>
</body>
</html>
